name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build all targets
        run: swift build
      - name: Run safety checks
        run: swift run SafetyChecks
      - name: Run isolated transfer-engine checks
        run: swift run EngineChecks
      - name: Build app bundle
        run: CLOUD_TRANSFER_APP_DIR="$PWD/Cloud Transfer+.app" ./scripts/build.sh
      - name: Package app
        run: ditto -c -k --keepParent "Cloud Transfer+.app" Cloud-Transfer-Plus.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Transfer-Plus
          path: Cloud-Transfer-Plus.zip
          retention-days: 14
